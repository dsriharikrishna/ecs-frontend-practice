services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecs-frontend-practice:local
    ports:
      - "8080:80"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
